<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECELÃO MUSICAL - BRUSQUE</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <section id="telaIdentificacao" class="tela-cheia">
        
        <div id="particles-js"></div>

        <div class="cartao-identificacao">
            <h1 class="texto-caixa-alta">BEM-VINDO AO JOGO!</h1>
            <p class="texto-caixa-alta">QUER NOS CONTAR QUEM VOCÊ É?</p>
            
            <div class="grupo-input">
                <input type="text" id="inputNome" placeholder="QUAL O SEU NOME?" class="input-estilizado">
                <input type="text" id="inputEscola" placeholder="QUAL SUA ESCOLA?" class="input-estilizado">
                <input type="number" id="inputIdade" placeholder="SUA IDADE?" class="input-estilizado">
            </div>

            <button onclick="iniciarJogo()" class="btn-principal">VAMOS JOGAR! 🚀</button>
        </div>
    </section>

    <main id="containerJogo" class="container-jogo oculto">

        <aside class="barra-lateral">
            <header class="status-jogo">
                <h2 class="texto-caixa-alta">🧵 TECELÃO</h2>
                <p id="contadorFase">FASE 1/15</p>
                <p>👤 <span id="nomeJogador">JOGADOR</span></p>
            </header>

            <div id="listaProgresso" class="progresso-fases"></div>

            <div class="indicador-velocidade">
                <span id="txtVelocidade" class="texto-caixa-alta">VELOCIDADE: 🐌 LENTO</span> 
            </div>

            <div class="ajuda-visual">
                <img src="./assets/marreco.png" alt="MARRECO" class="marreco-decorativo">
            </div>
        </aside>

        <section class="area-ritmo">
            
            <img id="fundoRevelacao" class="fundo-revelacao" src="" alt="Fundo Revelação">

            <div class="container-alvo-lateral">
                <div class="dica-espaco-lateral">
                    <p class="texto-caixa-alta">APERTE <strong>ESPAÇO</strong> AQUI!</p>
                </div>
                <div id="linhaAlvo" class="linha-alvo-lateral">
                    <img src="./assets/caixa-som.png" alt="CAIXA DE SOM">
                </div>
            </div>

            <div id="bolinhaCaindo" class="bolinha-ritmo-lateral"></div>

            <div class="container-marreco-animado">
                <video id="videoMarreco" class="video-marreco" autoplay loop muted playsinline>
                    <source src="" type="video/mp4">
                </video>
            </div>

            <div id="modalPergunta" class="modal-pergunta oculto">
                
                <img id="imagemPerguntaMini" src="" alt="Imagem da Fase" class="imagem-mini-pergunta-fora">

                <div class="cartao-pergunta">
                    <button id="btnVoz" class="btn-ouvir-audio">🔊 OUVIR PERGUNTA</button>

                    <h3 id="perguntaTexto" class="texto-pergunta"></h3>

                    <div id="containerOpcoes" class="opcoes-resposta">
                        </div>

                    <div id="feedbackResposta" class="feedback-resposta oculto">
                        <p id="tituloFeedback" class="texto-caixa-alta">🎉 MUITO BEM!</p>
                        <p id="curiosidadeTexto" class="curiosidade"></p>
                        <button id="btnProximaFase" class="btn-avancar">PRÓXIMA FASE →</button>
                    </div>
                </div>
            </div>

        </section>

    </main>

    <section id="telaResultado" class="tela-cheia oculto">
        <div class="cartao-resultado">
            <h1 id="tituloResultado" class="texto-caixa-alta">PARABÉNS!</h1>
            <div id="areaMarrecoFinal">
                </div>
            <p id="mensagemFinal" class="texto-caixa-alta"></p>
            <button onclick="location.reload()" class="btn-principal">JOGAR DE NOVO 🔄</button>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
